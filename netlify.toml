[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These values are public/runtime configuration, not credentials. Keep
  # scanning enabled for API keys, OAuth secrets, and encryption material.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,GEMINI_MODEL,GEMINI_TIMEOUT_MS,GEMINI_WEBSITE_MODEL,GEMINI_WEBSITE_MODELS,GEMINI_WEBSITE_TIMEOUT_MS,GEMINI_WEBSITE_CODE_TIMEOUT_MS,GEMINI_WEBSITE_RETRY_DELAY_MS,ELEVENLABS_AGENT_ID,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_REDIRECT_URI,EVERONN_DATA_FILE,EVERONN_CONNECTIONS_FILE,AUTH_EMAIL_FROM,PHONE_FRONT_DESK_FOLLOW_UP_ENABLED"
